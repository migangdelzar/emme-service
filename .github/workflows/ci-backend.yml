name: CI Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify documentation
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/validate-markdown.mjs
      - name: Run Gradle quality lifecycle
        run: ./gradlew ci -x test -x integrationTest -x e2eTest --no-daemon --no-configuration-cache --stacktrace

  test:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run platform tests
        run: ./gradlew :applications:emme-platform:test --no-daemon --no-configuration-cache --stacktrace

  build-logic:
    name: Build-logic unit and functional tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :build-logic:check --no-daemon --no-configuration-cache --stacktrace

  boot-jar:
    needs: [quality, test, build-logic]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :applications:emme-platform:bootJar :applications:studio-api:bootJar --no-daemon --no-configuration-cache --stacktrace

  deploy:
    needs: boot-jar
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Deploy
        run: ./gradlew deploy -Paction=up -Pprovider=${{ github.ref_name == 'main' && 'prod' || 'k3d' }} --no-daemon --no-configuration-cache
