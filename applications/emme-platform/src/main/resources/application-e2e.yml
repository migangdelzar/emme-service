# E2E profile — schema-per-tenant via Hibernate multi-tenancy (bean: prefix).
spring:
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        multi_tenancy: SCHEMA
  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/emme?currentSchema=emme_core"
    username: ${DB_USERNAME:emme}
    password: ${DB_PASSWORD:emme}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: emme-core-pool

app:
  keycloak:
    provisioning:
      enabled: true
    admin-password: "${E2E_KEYCLOAK_ADMIN_PASSWORD:}"

emme:
  tenancy:
    tenant-datasource:
      url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/emme"
      username: ${DB_USERNAME:emme}
      password: ${DB_PASSWORD:emme}
      driver-class-name: org.postgresql.Driver
