# application-integration-test.yml - integration tests with real Testcontainers infrastructure
# Auto-applied by @PostgresIntegrationTest (@ActiveProfiles includes "integration-test")
testcontainers:
  reuse:
    enable: true
spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        hbm2ddl:
          create_namespaces: true
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true
  liquibase:
    enabled: false
