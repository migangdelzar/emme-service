apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: emme-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          # Redis 8 includes the vector-search modules used by the optional
          # Spring AI hot semantic-cache projection and supports linux/arm64.
          image: redis:8.10.1-alpine3.23
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: emme-dev
spec:
  selector:
    app: redis
  ports:
    - port: 6379
