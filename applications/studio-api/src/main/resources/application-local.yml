spring:
  devtools:
    restart:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/emme
    username: emme
    password: emme
  jpa:
    hibernate:
      ddl-auto: update
  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: http://localhost:18080/realms/emme
        registration:
          keycloak:
            client-id: emme-salon-app
            scope: openid,profile,email
      resourceserver:
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

app:
  keycloak:
    base-url: http://localhost:18080
    issuer-uri: http://localhost:18080/realms/emme
    client-id: emme-salon-app
    admin-realm: master
    admin-username: admin
    admin-password: admin
    default-realm: emme
  google:
    oauth:
      encryption-key: 12345678901234567890123456789012
      client-id: dev-client-id
      client-secret: dev-client-secret
      redirect-uri: http://localhost:8080/oauth/callback
  identity:
    login-rate-limit:
      max-attempts: 500
      window-ms: 60000

logging:
  level:
    com.emme: DEBUG
    org.springframework.security: INFO
