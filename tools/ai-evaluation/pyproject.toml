[project]
name = "emme-ai-evaluation"
version = "0.1.0"
description = "Offline Ragas evaluation worker for governed Emme AI traces"
requires-python = ">=3.13,<3.14"
dependencies = [
  "ragas>=0.4,<0.5",
  "langchain-community>=0.3.31,<0.4",
]

[project.scripts]
emme-ai-evaluate = "emme_ai_evaluation.cli:main"

[dependency-groups]
dev = [
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
