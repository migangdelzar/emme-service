spring:
  application:
    name: emme-platform
  threads:
    virtual:
      enabled: true
  datasource:
    core:
      url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/emme?currentSchema=emme_core
      username: ${DB_USERNAME:emme}
      password: ${DB_PASSWORD:emme}
      hikari:
        maximum-pool-size: 5
        minimum-idle: 2
        pool-name: emme-core-pool
    tenant:
      url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/emme
      username: ${DB_USERNAME:emme}
      password: ${DB_PASSWORD:emme}
      hikari:
        maximum-pool-size: 20
        minimum-idle: 5
        pool-name: emme-tenant-pool
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        dialect: org.hibernate.dialect.PostgreSQLDialect
        multi_tenancy: SCHEMA
        multi_tenant_connection_provider: com.emme.tenancy.adapter.out.client.database.SchemaMultiTenantConnectionProvider
        tenant_identifier_resolver: com.emme.tenancy.adapter.out.client.database.TenantIdentifierResolver
  liquibase:
    change-log: classpath:db/changelog-root.yml
    contexts: dev
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/emme-core
          jwk-set-uri: http://localhost:8080/realms/emme-core/protocol/openid-connect/certs
  modulith:
    events:
      externalization:
        enabled: ${EMME_KAFKA_EVENTS_ENABLED:false}
        serialize-externalization: true
      republish-outstanding-events-on-restart: true
      jdbc:
        schema-initialization:
          enabled: false
    detection-strategy: explicitly-annotated
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 10
      properties:
        enable.idempotence: true
        compression.type: zstd
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}

server:
  port: 8081
  shutdown: graceful
  servlet:
    session:
      cookie:
        name: EMME_SESSION
        same-site: lax
        secure: true
        http-only: true
        path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,loggers,modulith
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      show-components: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles.active:dev}
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0  # 100% in dev, lower in prod (0.1)
  observations:
    key-values:
      application: ${spring.application.name}

# OpenTelemetry — exports to local collector (Alloy/OTEL Collector)
otel:
  traces:
    exporter: otlp
  metrics:
    exporter: prometheus
  logs:
    exporter: none
  exporter:
    otlp:
      endpoint: http://localhost:4318
      protocol: http/protobuf
  sdk:
    disabled: false

# App-specific configuration
app:
  messaging:
    kafka:
      enabled: ${EMME_KAFKA_EVENTS_ENABLED:false}
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      security-protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      producer-retries: ${KAFKA_PRODUCER_RETRIES:10}
      consumer-group: ${KAFKA_CONSUMER_GROUP:emme-platform}
      sasl-mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
      sasl-jaas-config: ${KAFKA_SASL_JAAS_CONFIG:}
  keycloak:
    base-url: http://localhost:8080
    issuer-uri: http://localhost:8080/realms/emme-core
    client-id: salon-app
    platform-client-id: admin-app
    default-realm: emme-core
    customer-issuer-uri: http://localhost:8080/realms/emme-customers
    customer-client-id: client-app
    admin-password: ${EMME_KEYCLOAK_ADMIN_PASSWORD:}
    provisioning:
      enabled: ${EMME_KEYCLOAK_PROVISIONING_ENABLED:true}
      initial-admin-password: ${EMME_KEYCLOAK_PROVISIONING_INITIAL_ADMIN_PASSWORD:}
      initial-owner-password: ${EMME_KEYCLOAK_PROVISIONING_INITIAL_OWNER_PASSWORD:}
  ai:
    provider: mock
    # provider: ollama  # switch to Ollama (needs ollama running)
    # provider: groq   # switch to Groq
    chat:
      model: llama-3.3-70b-versatile
      base-url: https://api.groq.com/openai/v1
      api-key: ${GROQ_API_KEY:}
      temperature: 0.7
      # model: gemma3:4b          # Ollama chat model
      # base-url: http://localhost:11434  # Ollama base URL
    embedding:
      model: bge-m3
      base-url: http://localhost:11434
      dimension: 1024
      # model: nomic-embed-text   # alternative Ollama embedding model (768 — change dimension too)
    semantic-routing:
      enabled: ${EMME_AI_SEMANTIC_ROUTING_ENABLED:false}
      locale: ${EMME_AI_SEMANTIC_ROUTING_LOCALE:es-MX}
      minimum-top1-similarity: ${EMME_AI_SEMANTIC_ROUTING_MIN_TOP1:0.90}
      minimum-margin: ${EMME_AI_SEMANTIC_ROUTING_MIN_MARGIN:0.10}
    semantic-cache:
      enabled: ${EMME_AI_SEMANTIC_CACHE_ENABLED:false}
      minimum-similarity: ${EMME_AI_SEMANTIC_CACHE_MIN_SIMILARITY:0.95}
      ttl: ${EMME_AI_SEMANTIC_CACHE_TTL:5m}
      prompt-version: ${EMME_AI_SEMANTIC_CACHE_PROMPT_VERSION:chat-v1}
    spring-chat:
      enabled: ${EMME_SPRING_AI_CHAT_ENABLED:false}
      # Additional named ChatClient beans can be added by provider modules and
      # listed here in failover order.
      providers:
        - bean-name: ollamaChatClient
          key: local-ollama
          model-version: ollama-chat
    spring-embedding:
      enabled: ${EMME_SPRING_AI_EMBEDDING_ENABLED:false}
      # Provider order is explicit. Add another named EmbeddingModel bean for cloud fallback.
      providers:
        - bean-name: ollamaEmbeddingModel
          key: local-ollama
          model-version: ollama-bge-m3
    spring-rag:
      # Requires the named Spring AI chat and embedding integrations above.
      enabled: ${EMME_SPRING_AI_RAG_ENABLED:false}
      retrieval-limit: ${EMME_SPRING_AI_RAG_RETRIEVAL_LIMIT:5}
    spring-extraction:
      enabled: ${EMME_SPRING_AI_EXTRACTION_ENABLED:false}
      model-version: ${EMME_SPRING_AI_EXTRACTION_MODEL_VERSION:ollama-gemma3-vision}
      prompt-version: ${EMME_SPRING_AI_EXTRACTION_PROMPT_VERSION:nail-design-v1}
      schema-version: ${EMME_SPRING_AI_EXTRACTION_SCHEMA_VERSION:nail-features-v1}
    langgraph:
      enabled: ${EMME_AI_LANGGRAPH_ENABLED:false}
      graph-version: ${EMME_AI_LANGGRAPH_GRAPH_VERSION:quote-v1}
    quote:
      enabled: ${EMME_AI_QUOTE_ENABLED:false}
    redis:
      enabled: ${EMME_AI_REDIS_ENABLED:false}
  whatsapp:
    verify-token: ${WHATSAPP_VERIFY_TOKEN:}
    app-secret: ${WHATSAPP_APP_SECRET:}
    tenant-id: ${WHATSAPP_TENANT_ID:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    phone-number-id: ${WHATSAPP_PHONE_ID:}
    api-base-url: ${WHATSAPP_API_BASE_URL:https://graph.facebook.com/v21.0}
  notification:
    email:
      provider: mock
      from: emme@emme.app
    smtp:
      host: ${SMTP_HOST:smtp.gmail.com}
      port: ${SMTP_PORT:587}
      username: ${SMTP_USERNAME:}
      password: ${SMTP_PASSWORD:}
    sendgrid:
      api-key: ${SENDGRID_API_KEY:}
    ses:
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}
      region: ${AWS_REGION:us-east-1}
    sms:
      provider: mock
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from-number: ${TWILIO_FROM_NUMBER:}
    messagebird:
      api-key: ${MESSAGEBIRD_API_KEY:}
      originator: ${MESSAGEBIRD_ORIGINATOR:Emme}
    vonage:
      api-key: ${VONAGE_API_KEY:}
      api-secret: ${VONAGE_API_SECRET:}
      from-number: ${VONAGE_FROM_NUMBER:Emme}
    push:
      provider: mock
    fcm:
      service-account: ${FCM_SERVICE_ACCOUNT_BASE64:}
      project-id: ${FCM_PROJECT_ID:}
    apns:
      key-id: ${APNS_KEY_ID:}
      team-id: ${APNS_TEAM_ID:}
      private-key: ${APNS_PRIVATE_KEY_BASE64:}
      bundle-id: ${APNS_BUNDLE_ID:com.emme.salon}
      sandbox: ${APNS_USE_SANDBOX:false}
  calendar:
    google:
      service-account-json-base64: ${GOOGLE_SA_JSON_BASE64:}
      token-url: https://oauth2.googleapis.com/token
      free-busy-url: https://www.googleapis.com/calendar/v3/freeBusy
    calendar-id: ${GOOGLE_CALENDAR_ID:primary}
  google:
    oauth:
      client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
      client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:8080/api/google/oauth/callback}
      encryption-key: ${GOOGLE_TOKEN_ENCRYPTION_KEY:local-google-token-key-32-bytes!}
  payment:
    provider: mock
    mercadopago:
      access-token: ${MP_ACCESS_TOKEN:}
      public-key: ${MP_PUBLIC_KEY:}
      webhook-secret: ${MP_WEBHOOK_SECRET:}
    paypal:
      client-id: ${PAYPAL_CLIENT_ID:}
      client-secret: ${PAYPAL_CLIENT_SECRET:}
      webhook-id: ${PAYPAL_WEBHOOK_ID:}
    conekta:
      private-key: ${CONEKTA_PRIVATE_KEY:}
      webhook-secret: ${CONEKTA_WEBHOOK_SECRET:}
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

# OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# ShedLock — coordinates @Scheduled tasks across instances
shedlock:
  defaults:
    lock-at-most-for: PT30S
    lock-at-least-for: PT5S

# Multi-tenant pool configuration
emme:
  tenancy:
    pooling:
      global-max-connections: 200
      idle-timeout-minutes: 30
      eviction-check-interval-seconds: 60
      default-min-pool-size: 5
      default-max-pool-size: 20
      default-database-id: "00000000-0000-0000-0000-000000000000"
