databaseChangeLog:
  - changeSet:
      id: 003-identity
      author: emme
      comment: Create cross-tenant platform identity tables (tenant, role, permission, role_permission, membership) in emme_core schema.
      changes:
        # --- tenant ---
        - createTable:
            schemaName: emme_core
            tableName: tenant
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_tenant
              - column:
                  name: slug
                  type: varchar(50)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_tenant_slug
              - column:
                  name: name
                  type: varchar(150)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(20)
                  defaultValue: ACTIVE
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - sql:
            sql: |
              ALTER TABLE emme_core.tenant
                ADD CONSTRAINT ck_tenant_status
                CHECK (status IN ('ACTIVE', 'SUSPENDED', 'DELETED'));

        # --- role ---
        - createTable:
            schemaName: emme_core
            tableName: role
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_role
              - column:
                  name: code
                  type: varchar(50)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_role_code
              - column:
                  name: name
                  type: varchar(150)
                  constraints:
                    nullable: false
              - column:
                  name: scope
                  type: varchar(10)
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
        - sql:
            sql: |
              ALTER TABLE emme_core.role
                ADD CONSTRAINT ck_role_scope
                CHECK (scope IN ('PLATFORM', 'TENANT'));

        # --- permission ---
        - createTable:
            schemaName: emme_core
            tableName: permission
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_permission
              - column:
                  name: code
                  type: varchar(100)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_permission_code
              - column:
                  name: name
                  type: varchar(150)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(500)
              - column:
                  name: active
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

        # --- role_permission ---
        - createTable:
            schemaName: emme_core
            tableName: role_permission
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_role_permission
              - column:
                  name: role_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_role_permission_role
                    references: emme_core.role(id)
              - column:
                  name: permission_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_role_permission_permission
                    references: emme_core.permission(id)
              - column:
                  name: granted_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - sql:
            sql: |
              ALTER TABLE emme_core.role_permission
                ADD CONSTRAINT uk_role_permission
                UNIQUE (role_id, permission_id);
        - createIndex:
            schemaName: emme_core
            tableName: role_permission
            indexName: idx_role_permission_role
            columns:
              - column:
                  name: role_id
        - createIndex:
            schemaName: emme_core
            tableName: role_permission
            indexName: idx_role_permission_perm
            columns:
              - column:
                  name: permission_id

        # --- membership ---
        - createTable:
            schemaName: emme_core
            tableName: membership
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_membership
              - column:
                  name: tenant_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_membership_tenant
                    references: emme_core.tenant(id)
              - column:
                  name: role_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_membership_role
                    references: emme_core.role(id)
              - column:
                  name: user_reference
                  type: varchar(150)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(20)
                  defaultValue: ACTIVE
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - sql:
            sql: |
              ALTER TABLE emme_core.membership
                ADD CONSTRAINT ck_membership_status
                CHECK (status IN ('ACTIVE', 'SUSPENDED', 'REVOKED'));
        - createIndex:
            schemaName: emme_core
            tableName: membership
            indexName: idx_membership_tenant
            columns:
              - column:
                  name: tenant_id
        - createIndex:
            schemaName: emme_core
            tableName: membership
            indexName: idx_membership_user
            columns:
              - column:
                  name: user_reference
        - createIndex:
            schemaName: emme_core
            tableName: membership
            indexName: idx_membership_role
            columns:
              - column:
                  name: role_id

      rollback:
        - dropTable:
            schemaName: emme_core
            tableName: membership
        - dropTable:
            schemaName: emme_core
            tableName: role_permission
        - dropTable:
            schemaName: emme_core
            tableName: permission
        - dropTable:
            schemaName: emme_core
            tableName: role
        - dropTable:
            schemaName: emme_core
            tableName: tenant
