---
name: CI Backend

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Backend quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-gradle
      - name: Set up Node.js for documentation validation
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate documentation
        run: node scripts/validate-markdown.mjs
      - name: Run Gradle static-analysis lifecycle
        run: >-
          ./gradlew ci -x test -x integrationTest -x e2eTest --no-daemon
          --no-configuration-cache --stacktrace
      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-quality-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7

  test:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-gradle
      - name: Run all backend unit and module tests
        run: ./gradlew test --no-daemon --no-configuration-cache --stacktrace
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7

  integration:
    name: Integration tests
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-gradle
      - name: Run integration tests
        run: >-
          ./gradlew integrationTest --no-daemon --no-configuration-cache
          --stacktrace
      - name: Upload integration reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7

  coverage:
    name: JaCoCo application coverage
    needs: [quality, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - uses: ./.github/actions/setup-gradle
      - name: Verify emme-platform JaCoCo coverage
        run: >-
          ./gradlew :applications:emme-platform:coverageCheck
          --no-daemon --no-configuration-cache --stacktrace
      - name: Upload JaCoCo reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-reports
          path: applications/emme-platform/build/reports/jacoco/**
          if-no-files-found: ignore
          retention-days: 7

  build-logic:
    name: Build-logic unit and functional tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-gradle
      - name: Run build-logic checks
        run: >-
          ./gradlew :build-logic:check --no-daemon --no-configuration-cache
          --stacktrace
      - name: Upload build-logic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logic-reports
          path: build-logic/build/reports/**
          if-no-files-found: ignore
          retention-days: 7

  infrastructure:
    name: Validate infrastructure manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: 'v1.34.1'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14.0'
      - name: Render Kubernetes overlays
        run: |
          kubectl kustomize infra/kubernetes/overlays/dev >/dev/null
          kubectl kustomize infra/kubernetes/overlays/dev-native >/dev/null
          kubectl kustomize infra/kubernetes/overlays/prod >/dev/null
          kubectl kustomize infra/kubernetes/overlays/prod-native >/dev/null
      - name: Validate Compose runtime overlays
        run: |
          docker compose -f deployment/compose/compose.yml \
            -f deployment/compose/compose.jvm.yml config --quiet
          docker compose -f deployment/compose/compose.yml \
            -f deployment/compose/compose.native.yml config --quiet
      - name: Validate Terraform
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  boot-jar:
    needs: [quality, test, integration, build-logic, infrastructure, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-gradle
      - name: Build canonical platform boot JAR
        run: >-
          ./gradlew :applications:emme-platform:bootJar --no-daemon
          --no-configuration-cache --stacktrace
      - name: Upload boot JAR and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emme-platform-boot-jar
          path: |
            applications/emme-platform/build/libs/*.jar
            applications/emme-platform/build/reports/**
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    needs: [boot-jar, summary]
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-gradle
      - name: Deploy
        run: >-
          ./gradlew deploy -Paction=up
          -Pprovider=${{ github.ref_name == 'main' && 'prod' || 'k3d' }}
          --no-daemon --no-configuration-cache

  summary:
    name: CI summary
    if: always()
    needs:
      - quality
      - test
      - integration
      - build-logic
      - infrastructure
      - coverage
      - boot-jar
    runs-on: ubuntu-24.04
    steps:
      - name: Publish result summary
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          BUILD_LOGIC_RESULT: ${{ needs['build-logic'].result }}
          INFRASTRUCTURE_RESULT: ${{ needs.infrastructure.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          BOOT_JAR_RESULT: ${{ needs['boot-jar'].result }}
        run: |
          echo "## Backend CI" >> "$GITHUB_STEP_SUMMARY"
          echo "- Quality: ${QUALITY_RESULT}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tests: ${TEST_RESULT}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Integration: ${INTEGRATION_RESULT}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build logic: ${BUILD_LOGIC_RESULT}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Infrastructure: ${INFRASTRUCTURE_RESULT}" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "- JaCoCo coverage: ${COVERAGE_RESULT}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Boot JAR: ${BOOT_JAR_RESULT}" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${QUALITY_RESULT}" != "success" ||
                "${TEST_RESULT}" != "success" ||
                "${INTEGRATION_RESULT}" != "success" ||
                "${BUILD_LOGIC_RESULT}" != "success" ||
                "${INFRASTRUCTURE_RESULT}" != "success" ||
                "${COVERAGE_RESULT}" != "success" ||
                "${BOOT_JAR_RESULT}" != "success" ]]; then
            exit 1
          fi
