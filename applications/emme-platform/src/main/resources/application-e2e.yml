# E2E profile — schema-per-tenant via TenantContextAspect.
# The aspect sets search_path per request from tenant_registry.
# Disable Hibernate DDL validation — tables live in per-tenant schemas.
spring:
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: "public"
  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/emme?currentSchema=emme_core,public"

app:
  keycloak:
    provisioning:
      enabled: true
    admin-password: "${E2E_KEYCLOAK_ADMIN_PASSWORD:}"
