---
# JVM runtime overlay for the K3s environment.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ../../jobs

namespace: emme-prod

images:
  - name: ghcr.io/migangdelzar/emme-service
    newTag: 0.1.0

patches:
  - patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "prod"
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: backend
