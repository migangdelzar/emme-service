apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: emme-alerts
  namespace: emme
  labels:
    app: emme-modulith
    role: alert-rules
spec:
  groups:
    - name: emme-backend
      rules:
        # ── Booking failures ──
        - alert: HighAppointmentFailureRate
          expr: |
            rate(http_server_requests_seconds_count{uri=~"/api/appointments", status=~"4..|5.."}[5m])
            / rate(http_server_requests_seconds_count{uri=~"/api/appointments"}[5m]) > 0.1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Appointment failure rate > 10%"
            description: "{{ $value | humanizePercentage }} of appointment requests fail"

        # ── Webhook failures ──
        - alert: WhatsAppWebhookFailure
          expr: rate(http_server_requests_seconds_count{uri="/api/webhooks/whatsapp", status=~"4..|5.."}[5m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "WhatsApp webhook returning errors"

        # ── AI latency ──
        - alert: HighAILatency
          expr: |
            histogram_quantile(0.95, rate(http_server_requests_seconds_bucket{uri=~"/api/ai/.*"}[5m])) > 20
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "AI p95 latency > 20s"

        # ── Projection lag ──
        - alert: ProjectionLag
          expr: modulith_events_incomplete_total > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Modulith events not processed"
            description: "{{ $value }} events pending publication"

        # ── Database health ──
        - alert: PostgresDown
          expr: up{job="postgres"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "PostgreSQL is down"

        - alert: HighDBConnections
          expr: hikaricp_connections_active / hikaricp_connections_max > 0.8
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "DB connection pool > 80%"

        # ── Pod restarts ──
        - alert: FrequentPodRestarts
          expr: rate(kube_pod_container_status_restarts_total{namespace="emme"}[15m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod restarting in emme namespace"

        # ── Redis ──
        - alert: RedisDown
          expr: up{job="redis"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Redis is down"

        # ── Application health ──
        - alert: ApplicationDown
          expr: up{job="emme-backend"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "EMME backend is down"

        # ── High error rate ──
        - alert: HighErrorRate
          expr: |
            rate(http_server_requests_seconds_count{status=~"5.."}[5m])
            / rate(http_server_requests_seconds_count[5m]) > 0.05
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "5xx error rate > 5%"
