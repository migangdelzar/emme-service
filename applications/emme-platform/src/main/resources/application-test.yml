spring:
  application:
    name: emme-platform
  task:
    scheduling:
      enabled: false

app:
  tenant:
    provisioning:
      enabled: false
  datasource:
    url: jdbc:h2:mem:emme;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create
  liquibase:
    enabled: false
  modulith:
    events:
      externalization:
        enabled: false
      jdbc:
        schema-initialization:
          enabled: true

logging:
  level:
    com.emme: DEBUG
