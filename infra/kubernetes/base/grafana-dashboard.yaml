apiVersion: v1
kind: ConfigMap
metadata:
  name: emme-dashboard
  namespace: emme
  labels:
    grafana_dashboard: "1"
data:
  emme-overview.json: |
    {
      "title": "EMME Modulith Overview",
      "panels": [
        {
          "title": "Request Rate",
          "targets": [{"expr": "rate(http_server_requests_seconds_count[1m])"}]
        },
        {
          "title": "Error Rate",
          "targets": [{"expr": "rate(http_server_requests_seconds_count{status=~'5..'}[1m]) / rate(http_server_requests_seconds_count[1m])"}]
        },
        {
          "title": "p95 Latency",
          "targets": [{"expr": "histogram_quantile(0.95, rate(http_server_requests_seconds_bucket[1m]))"}]
        },
        {
          "title": "Active Connections",
          "targets": [{"expr": "hikaricp_connections_active"}]
        },
        {
          "title": "Modulith Events",
          "targets": [{"expr": "modulith_events_incomplete_total"}]
        }
      ]
    }
