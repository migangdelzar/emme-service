databaseChangeLog:
  - changeSet:
      id: 002-tenant-registry
      author: emme
      comment: Create tenant placement registry for shared and dedicated tenant databases.
      changes:
        - createTable:
            schemaName: emme_core
            tableName: tenant_registry
            columns:
              - column:
                  name: tenant_id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_tenant_registry
              - column:
                  name: slug
                  type: varchar(63)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_tenant_registry_slug
              - column:
                  name: schema_name
                  type: varchar(63)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_tenant_registry_schema
              - column:
                  name: database_mode
                  type: varchar(16)
                  defaultValue: SHARED
                  constraints:
                    nullable: false
              - column:
                  name: database_key
                  type: varchar(128)
                  defaultValue: emme
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(24)
                  defaultValue: PROVISIONING
                  constraints:
                    nullable: false
              - column:
                  name: schema_version
                  type: varchar(64)
              - column:
                  name: last_migrated_at
                  type: timestamptz
              - column:
                  name: migration_error
                  type: text
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - sql:
            sql: |
              ALTER TABLE emme_core.tenant_registry
                ADD CONSTRAINT ck_tenant_registry_database_mode
                CHECK (database_mode IN ('SHARED', 'DEDICATED'));
        - sql:
            sql: |
              ALTER TABLE emme_core.tenant_registry
                ADD CONSTRAINT ck_tenant_registry_status
                CHECK (status IN ('PROVISIONING', 'ACTIVE', 'SUSPENDED', 'MIGRATING', 'FAILED', 'DELETED'));
        - sql:
            sql: |
              ALTER TABLE emme_core.tenant_registry
                ADD CONSTRAINT ck_tenant_registry_schema_name
                CHECK (
                  schema_name ~ '^[a-z][a-z0-9_]{0,62}$'
                  AND schema_name NOT IN ('public', 'emme_core', 'information_schema')
                  AND schema_name NOT LIKE 'pg\_%'
                );
        - createIndex:
            schemaName: emme_core
            tableName: tenant_registry
            indexName: idx_tenant_registry_status
            columns:
              - column:
                  name: status
      rollback:
        - dropTable:
            schemaName: emme_core
            tableName: tenant_registry
