# application-test.yml — L4 module tests: MockMvc + H2 + real JPA persistence
# Loads the full TestApplication context (every module component-scanned), so it needs the
# same cross-module bootstrap config as application-repository.yml; see that file's header.
spring:
  task:
    scheduling:
      enabled: false
  jpa:
    entity-scan:
      packages: com.emme
    hibernate:
      ddl-auto: create
    open-in-view: false
    properties:
      hibernate:
        multi_tenancy: NONE
        dialect: org.hibernate.dialect.H2Dialect
        hbm2ddl:
          create_namespaces: true
        create_empty_composites:
          enabled: true
  datasource:
    core:
      url: ""
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: never
  liquibase:
    enabled: false
  modulith:
    events:
      externalization:
        enabled: false
      jdbc:
        schema-initialization:
          enabled: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - net.javacrumbs.shedlock.spring.autoconfigure.ShedLockAutoConfiguration
      - org.springframework.boot.security.oauth2.client.autoconfigure.servlet.OAuth2ClientAutoConfiguration
      - org.springframework.boot.security.oauth2.client.autoconfigure.reactive.ReactiveOAuth2ClientAutoConfiguration
  cache:
    type: none
  data:
    redis:
      repositories:
        enabled: false

app:
  tenant:
    provisioning:
      enabled: false
  ai:
    provider: mock
  calendar:
    google:
      service-account-json-base64: ""
    calendar-id: test-calendar

emme:
  tenancy:
    pooling:
      global-max-connections: 20
      idle-timeout-minutes: 1
      eviction-check-interval-seconds: 5
      default-min-pool-size: 2
      default-max-pool-size: 5
      default-database-id: "00000000-0000-0000-0000-000000000000"
