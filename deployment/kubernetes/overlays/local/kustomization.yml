apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: emme-local

images:
  - name: ghcr.io/migangdelzar/emme-service
    newTag: dev

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: emme-platform
      spec:
        replicas: 1
