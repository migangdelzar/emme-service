spring:
  application:
    name: emme-platform
  modulith:
    events:
      republish-outstanding-events-on-restart: true

app:
  keycloak:
    provisioning:
      enabled: ${EMME_KEYCLOAK_PROVISIONING_ENABLED:true}
  google:
    oauth:
      encryption-key: ${GOOGLE_TOKEN_ENCRYPTION_KEY}
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false

logging:
  level:
    com.emme: INFO
    org.springframework: WARN
