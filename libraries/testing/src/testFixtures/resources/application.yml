spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.security.oauth2.client.autoconfigure.servlet.OAuth2ClientAutoConfiguration
      - org.springframework.boot.security.oauth2.client.autoconfigure.reactive.ReactiveOAuth2ClientAutoConfiguration
  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: https://test-issuer/realms/emme
        registration:
          keycloak:
            client-id: test-client
            client-secret: test-secret

app:
  keycloak:
    base-url: http://localhost:8080
    issuer-uri: https://test-issuer/realms/emme
    client-id: test-client
    provisioning:
      initial-admin-password: test-provisioning-password
  google:
    oauth:
      client-id: test-client-id
      client-secret: test-client-secret
      redirect-uri: http://localhost:8080/api/google/oauth/callback
      encryption-key: test-google-oauth-key-32-bytes!!
