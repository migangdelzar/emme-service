# Optional AGE + pgvector runtime overlay.
#
# Build once with:
# docker compose -f deployment/compose/compose.yaml \
#   -f deployment/compose/compose.runtime-jvm.yaml \
#   -f deployment/compose/compose.age.yaml build postgres
#
# Then start the stack with the same three files. AGE is deliberately opt-in;
# the default compose runtime remains the official pgvector image.
services:
  postgres:
    image: ${POSTGRES_AGE_IMAGE:-emme-postgres-age-pgvector:local}
    build:
      context: ../..
      dockerfile: deployment/postgres/age-pgvector/Dockerfile

  emme-platform:
    environment:
      EMME_AI_AGE_ENABLED: "true"
      EMME_AI_AGE_GRAPH_PREFIX: ${EMME_AI_AGE_GRAPH_PREFIX:-emme_ai_graph_}
