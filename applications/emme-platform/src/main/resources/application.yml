spring:
  application:
    name: emme-platform
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/emme
    username: ${DB_USERNAME:emme}
    password: ${DB_PASSWORD:emme}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    change-log: classpath:db/changelog-root.yml
    contexts: dev
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/emme
          jwk-set-uri: http://localhost:8080/realms/emme/protocol/openid-connect/certs
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false
    detection-strategy: explicitly-annotated
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8081
  shutdown: graceful
  servlet:
    session:
      cookie:
        name: EMME_SESSION
        same-site: lax
        secure: true
        http-only: true
        path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,loggers,modulith
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      show-components: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles.active:dev}
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0  # 100% in dev, lower in prod (0.1)
  observations:
    key-values:
      application: ${spring.application.name}

# OpenTelemetry — exports to local collector (Alloy/OTEL Collector)
otel:
  traces:
    exporter: otlp
  metrics:
    exporter: prometheus
  logs:
    exporter: none
  exporter:
    otlp:
      endpoint: http://localhost:4318
      protocol: http/protobuf
  sdk:
    disabled: false

# App-specific configuration
app:
  keycloak:
    base-url: http://localhost:8080
    issuer-uri: http://localhost:8080/realms/emme
    client-id: emme-salon-app
  ai:
    provider: mock
    # provider: ollama  # switch to Ollama (needs ollama running)
    # provider: groq   # switch to Groq (needs GROQ_API_KEY env var)
    chat:
      model: llama-3.3-70b-versatile
      base-url: https://api.groq.com/openai/v1
      temperature: 0.7
      # model: gemma3:4b          # Ollama chat model
      # base-url: http://localhost:11434  # Ollama base URL
    embedding:
      model: bge-m3
      base-url: http://localhost:11434
      dimension: 1024
      # model: nomic-embed-text   # alternative Ollama embedding model (768 — change dimension too)
  whatsapp:
    verify-token: ${WHATSAPP_VERIFY_TOKEN:emme_verify_token}
    app-secret: ${WHATSAPP_APP_SECRET:}
    phone-number-id: ${WHATSAPP_PHONE_ID:}
  notification:
    email:
      provider: mock
      from: emme@emme.app
    smtp:
      host: ${SMTP_HOST:smtp.gmail.com}
      port: ${SMTP_PORT:587}
      username: ${SMTP_USERNAME:}
      password: ${SMTP_PASSWORD:}
    sendgrid:
      api-key: ${SENDGRID_API_KEY:}
    ses:
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}
      region: ${AWS_REGION:us-east-1}
    sms:
      provider: mock
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from-number: ${TWILIO_FROM_NUMBER:}
    messagebird:
      api-key: ${MESSAGEBIRD_API_KEY:}
    vonage:
      api-key: ${VONAGE_API_KEY:}
      api-secret: ${VONAGE_API_SECRET:}
    push:
      provider: mock
    fcm:
      service-account: ${FCM_SERVICE_ACCOUNT_BASE64:}
    apns:
      key-id: ${APNS_KEY_ID:}
      team-id: ${APNS_TEAM_ID:}
      private-key: ${APNS_PRIVATE_KEY_BASE64:}
      bundle-id: ${APNS_BUNDLE_ID:com.emme.salon}
  calendar:
    google:
      service-account: ${GOOGLE_SA_JSON_BASE64:}
    calendar-id: ${GOOGLE_CALENDAR_ID:primary}
  google:
    oauth:
      client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
      client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:8080/api/v1/google/oauth/callback}
      encryption-key: ${GOOGLE_TOKEN_ENCRYPTION_KEY:change-me-in-production}
  payment:
    provider: mock
    mercadopago:
      access-token: ${MP_ACCESS_TOKEN:}
      public-key: ${MP_PUBLIC_KEY:}
      webhook-secret: ${MP_WEBHOOK_SECRET:}
    paypal:
      client-id: ${PAYPAL_CLIENT_ID:}
      client-secret: ${PAYPAL_CLIENT_SECRET:}
      webhook-id: ${PAYPAL_WEBHOOK_ID:}
    conekta:
      private-key: ${CONEKTA_PRIVATE_KEY:}
      webhook-secret: ${CONEKTA_WEBHOOK_SECRET:}
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

# OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# ShedLock — coordinates @Scheduled tasks across instances
shedlock:
  defaults:
    lock-at-most-for: PT30S
    lock-at-least-for: PT5S

# Multi-tenant pool configuration
emme:
  tenancy:
    pooling:
      global-max-connections: 200
      idle-timeout-minutes: 30
      eviction-check-interval-seconds: 60
      default-min-pool-size: 5
      default-max-pool-size: 20
      default-database-id: "00000000-0000-0000-0000-000000000000"
