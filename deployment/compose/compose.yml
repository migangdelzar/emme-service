# Shared Compose base. Combine this file with exactly one runtime overlay:
# compose.jvm.yml or compose.native.yml.
services:
  emme-platform:
    # The base remains runnable for existing local commands. Runtime-specific
    # image selection is owned by the explicit JVM/native overlay.
    image: ${EMME_SERVICE_IMAGE:-ghcr.io/migangdelzar/emme-service:${TAG:-latest}}
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: ${PROFILE:-local}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.5"
    networks:
      - emme-net

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: emme
      POSTGRES_USER: emme
      POSTGRES_PASSWORD: ${DB_PASSWORD:-emme}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emme"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - emme-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - emme-net

networks:
  emme-net:
    driver: bridge

volumes:
  pgdata:
