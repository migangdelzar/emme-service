---
name: Module Boundary Verification

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: module-boundaries-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-gradle

      - name: Verify Spotless formatting
        run: >-
          ./gradlew spotlessCheck
          --no-daemon --no-configuration-cache --stacktrace

      - name: Verify module boundaries
        run: >-
          ./gradlew :applications:emme-platform:test
          --tests com.emme.ModularityTest
          --tests com.emme.LayerConventionTest
          --no-daemon --no-configuration-cache --stacktrace
