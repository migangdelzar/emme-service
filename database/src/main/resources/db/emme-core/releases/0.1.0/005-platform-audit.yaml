databaseChangeLog:
  - changeSet:
      id: 005-platform-audit
      author: emme
      comment: Create platform-level audit event table for cross-tenant platform events (tenant created, role assigned, system config changed).
      changes:
        - createTable:
            schemaName: emme_core
            tableName: platform_audit_event
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_platform_audit_event
              - column:
                  name: actor_reference
                  type: varchar(150)
                  constraints:
                    nullable: false
              - column:
                  name: action
                  type: varchar(120)
                  constraints:
                    nullable: false
              - column:
                  name: outcome
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: occurred_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - sql:
            sql: |
              ALTER TABLE emme_core.platform_audit_event
                ADD CONSTRAINT ck_platform_audit_event_outcome
                CHECK (outcome IN ('SUCCEEDED', 'DENIED', 'FAILED'));
        - createIndex:
            schemaName: emme_core
            tableName: platform_audit_event
            indexName: idx_platform_audit_actor
            columns:
              - column:
                  name: actor_reference
        - createIndex:
            schemaName: emme_core
            tableName: platform_audit_event
            indexName: idx_platform_audit_occurred
            columns:
              - column:
                  name: occurred_at
      rollback:
        - dropTable:
            schemaName: emme_core
            tableName: platform_audit_event
