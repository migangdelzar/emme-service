---
name: Security Scan

'on':
  workflow_call:
    inputs:
      require_nvd:
        description: Fail when the NVD API key is not configured
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      require_nvd:
        description: Fail when the NVD API key is not configured
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency vulnerability scan (NVD key required)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check NVD API key configuration
        id: nvd-key
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          REQUIRE_NVD: ${{ inputs.require_nvd }}
        run: |
          if [[ -n "$NVD_API_KEY" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          elif [[ "$REQUIRE_NVD" == "true" ]]; then
            echo "::error::NVD_API_KEY is required for this security scan. Configure the repository or environment secret before retrying."
            exit 1
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            warning="OWASP Dependency-Check skipped: configure the"
            warning="${warning} NVD_API_KEY repository secret."
            echo "::warning::${warning}"
          fi
      - uses: actions/checkout@v7
        if: steps.nvd-key.outputs.configured == 'true'
      - uses: ./.github/actions/setup-gradle
        if: steps.nvd-key.outputs.configured == 'true'
      - name: Cache OWASP Dependency-Check data
        uses: actions/cache@v6
        if: steps.nvd-key.outputs.configured == 'true'
        with:
          path: ~/.gradle/dependency-check-data
          key: >-
            dependency-check-data-${{ runner.os }}-
            ${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            dependency-check-data-${{ runner.os }}-
      - name: Run OWASP dependency check
        if: steps.nvd-key.outputs.configured == 'true'
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >-
          ./gradlew dependencyCheckAnalyze --no-daemon
          --no-configuration-cache --stacktrace
