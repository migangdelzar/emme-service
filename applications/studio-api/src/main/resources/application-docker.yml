# Docker compose override — JPA schema creation (no Liquibase for local dev)
spring:
  devtools:
    restart:
      enabled: true
  sql:
    init:
      mode: never
  liquibase:
    enabled: false
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        hbm2ddl:
          create_namespaces: true
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true

emme:
  tenancy:
    rls-enabled: false
    pooling:
      global-max-connections: 50
      idle-timeout-minutes: 15
      eviction-check-interval-seconds: 60
      default-min-pool-size: 3
      default-max-pool-size: 10
      default-database-id: "00000000-0000-0000-0000-000000000000"
