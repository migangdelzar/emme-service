spring:
  application:
    name: emme-platform-kafka-test
  task:
    scheduling:
      enabled: false
  datasource:
    url: jdbc:h2:mem:emme-kafka;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false
  liquibase:
    enabled: false
  modulith:
    events:
      externalization:
        enabled: true
      jdbc:
        schema-initialization:
          enabled: true

app:
  tenant:
    provisioning:
      enabled: false

logging:
  level:
    org.springframework.kafka: WARN
    org.springframework.modulith: INFO
