org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -Djava.net.preferIPv4Stack=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=fail
org.gradle.daemon=true

# ── Environment defaults ──
emme.env=dev
emme.env.dev.image.tag=dev
emme.env.dev.image.registry=local
emme.env.dev.health.url=http://localhost:8081/actuator/health
emme.env.dev.kustomize.overlay=dev
emme.env.prod.image.tag=latest
emme.env.prod.image.registry=ghcr
emme.env.prod.health.url=https://emme.app/actuator/health
emme.env.prod.kustomize.overlay=prod

# ── Emme Provider Selection ──
emme.container.runtime=docker
emme.deployment.target=compose
emme.deployment.profile=local
emme.registry.target=local
emme.security.scanner=trivy
emme.security.severity=HIGH,CRITICAL
emme.quality.gate=strict
emme.container.image.name=emme-service
emme.publishing.signingKeyId=

# Performance: max concurrent workers
org.gradle.workers.max=8
