# Shared PostgreSQL integration profile for tests using @PostgresIntegrationTest.
# The annotation activates this profile and supplies the Testcontainers database.
testcontainers:
  reuse:
    enable: true

spring:
  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        hbm2ddl:
          create_namespaces: true
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true
  liquibase:
    enabled: false
