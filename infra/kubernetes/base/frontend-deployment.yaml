apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: emme
  labels:
    app: emme-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: emme-frontend
  template:
    metadata:
      labels:
        app: emme-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/migangdelzar/emme-web:latest
          ports:
            - containerPort: 80
              name: http
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
